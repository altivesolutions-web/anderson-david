<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias — Corporación Anderson David S.A.C.</title>
  <meta name="description" content="Su consulta fue recibida. Le responderemos en menos de 2 horas hábiles.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logos/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .thanks-page {
      min-height: 100vh;
      background-color: var(--ad-navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--sp-12) var(--container-pad);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .thanks-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(42,128,200,0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    .thanks-content {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    .thanks-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(37,211,102,0.15);
      border: 2px solid rgba(37,211,102,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--sp-8);
      color: #25D366;
    }

    .thanks-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ad-white);
      margin-bottom: var(--sp-5);
      line-height: 1.1;
    }

    .thanks-desc {
      font-family: var(--font-body);
      font-size: var(--fs-lg);
      color: rgba(232,243,251,0.75);
      line-height: 1.65;
      margin-bottom: var(--sp-10);
    }

    .thanks-actions {
      display: flex;
      gap: var(--sp-4);
      justify-content: center;
      flex-wrap: wrap;
    }

    .thanks-logo {
      position: absolute;
      top: var(--sp-6);
      left: 50%;
      transform: translateX(-50%);
    }

    .thanks-logo-wrap {
      background-color: rgba(255,255,255,0.9);
      border-radius: var(--r-md);
      padding: 0.3rem 0.75rem;
      display: inline-flex;
    }

    .thanks-logo-wrap img {
      height: 36px;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="thanks-page" role="main">

    <a href="index.html" class="thanks-logo" aria-label="Volver al inicio">
      <div class="thanks-logo-wrap">
        <img src="assets/logos/logo-horizontal.png" alt="Corporación Anderson David S.A.C." width="160" height="36">
      </div>
    </a>

    <div class="thanks-content">
      <div class="thanks-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>

      <h1 class="thanks-title">
        Su consulta fue recibida
      </h1>

      <p class="thanks-desc">
        Le responderemos en menos de 2 horas hábiles con una propuesta de cotización detallada.
        Si necesita una respuesta inmediata, puede escribirnos por WhatsApp.
      </p>

      <div class="thanks-actions">
        <a href="https://wa.me/51952656820?text=Hola,%20acabo%20de%20enviar%20un%20formulario%20y%20quiero%20coordinar"
           class="btn btn--whatsapp"
           target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Escribir por WhatsApp
        </a>
        <a href="index.html" class="btn btn--outline">
          Volver al inicio
        </a>
      </div>
    </div>

  </div>

</body>
</html>
